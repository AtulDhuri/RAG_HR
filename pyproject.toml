[project]
name = "knowledge-intelligence-engine"
version = "0.1.0"
description = "Production-oriented document intelligence platform with grounded, cited answers"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5,<6",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "Pillow>=10,<12",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "python-pptx>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
  "sentence-transformers>=3,<4",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
